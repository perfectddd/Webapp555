    function isValidThaiID(id) {
      if (!id) return false;
      const clean = id.toString().replace(/[-\s]/g, '');
      if (clean.length !== 13 || !/^\d{13}$/.test(clean)) return false;
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        sum += parseInt(clean.charAt(i), 10) * (13 - i);
      }
      const check = (11 - (sum % 11)) % 10;
      return check === parseInt(clean.charAt(12), 10);
    }

            {/* Section 1 */}
            <div>
              <h3 className="font-bold text-emerald-800 text-sm mb-3">1. ข้อมูลประจำตัว</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div className="md:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">เลขประจำตัวประชาชน 13 หลัก *</label>
                  <input
                    type="text"
                    name="citizenId"
                    value={formData.citizenId}
                    onChange={handleChange}
                    maxLength="17"
                    placeholder="เช่น 1-5501-00123-45-6"
                    required
                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-emerald-400"
                  />
                  {idValid.checked && (
                    <span className={`text-xs mt-1 block font-semibold ${idValid.valid ? 'text-emerald-600' : 'text-red-500'}`}>
                      {idValid.valid ? '✓ รหัสประจำตัวประชาชนถูกต้อง (Modulo 11)' : '✗ Checksum เลขบัตรประชาชนไม่ถูกต้อง'}
                    </span>
                  )}
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">คำนำหน้า</label>
                  <select name="title" value={formData.title} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                    <option value="นาย">นาย</option>
                    <option value="สามเณร">สามเณร</option>
                    <option value="พระภิกษุ">พระภิกษุ</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อ *</label>
                  <input type="text" name="firstName" value={formData.firstName} onChange={handleChange} required className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">นามสกุล *</label>
                  <input type="text" name="lastName" value={formData.lastName} onChange={handleChange} required className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เบอร์โทรศัพท์</label>
                  <input type="tel" name="phone" value={formData.phone} onChange={handleChange} placeholder="08x-xxx-xxxx" className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
              </div>

              {/* Birth Date */}
              <div className="grid grid-cols-3 gap-3 mt-3 p-3 bg-slate-50 rounded-lg border border-slate-200">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เกิดวันที่</label>
                  <select name="birthDate" value={formData.birthDate} onChange={handleChange} className="w-full px-2 py-1.5 text-sm border border-slate-300 rounded bg-white">
                    {Array.from({length: 31}, (_, i) => i + 1).map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เดือนเกิด</label>
                  <select name="birthMonth" value={formData.birthMonth} onChange={handleChange} className="w-full px-2 py-1.5 text-sm border border-slate-300 rounded bg-white">
                    {THAI_MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ปีเกิด (พ.ศ.)</label>
                  <input type="number" name="birthYear" value={formData.birthYear} onChange={handleChange} className="w-full px-2 py-1.5 text-sm border border-slate-300 rounded bg-white" />
                </div>
              </div>
            </div>

            {/* Section 2 */}
            <div>
              <h3 className="font-bold text-emerald-800 text-sm mb-3">2. ภูมิลำเนาทหาร (จังหวัดน่าน)</h3>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">อำเภอ *</label>
                  <select name="district" value={formData.district} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white font-medium">
                    {amphurs.map(a => <option key={a.amphur_code} value={a.amphur_th}>อ.{a.amphur_th}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ตำบล *</label>
                  <input type="text" name="subDistrict" value={formData.subDistrict} onChange={handleChange} placeholder="เช่น ในเวียง" required className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">หมู่ที่</label>
                  <input type="number" name="moo" value={formData.moo} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">บ้านเลขที่</label>
                  <input type="text" name="houseNumber" value={formData.houseNumber} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                {/* Road Autocomplete */}
                <div className="relative md:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">ถนน (พิมพ์เพื่อค้นหาแบบ Autocomplete)</label>
                  <input
                    type="text"
                    name="road"
                    value={formData.road}
                    onChange={handleChange}
                    onFocus={() => setShowRoadSuggest(true)}
                    onBlur={() => setTimeout(() => setShowRoadSuggest(false), 200)}
                    placeholder="เช่น ถนนสุริยพงษ์"
                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"
                  />
                  {showRoadSuggest && roadSuggestions.length > 0 && (
                    <div className="absolute z-20 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-36 overflow-y-auto text-xs">
                      {roadSuggestions.map(road => (
                        <div
                          key={road}
                          onMouseDown={() => {
                            setFormData(p => ({ ...p, road }));
                            setShowRoadSuggest(false);
                          }}
                          className="px-3 py-2 hover:bg-emerald-50 hover:text-emerald-800 cursor-pointer"
                        >
                          {road}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">ตรอก / ซอย</label>
                  <input type="text" name="soi" value={formData.soi} onChange={handleChange} placeholder="เช่น ซอย 2" className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
              </div>
            </div>

            {/* Section 3 */}
            <div>
              <h3 className="font-bold text-emerald-800 text-sm mb-3">3. ข้อมูลครอบครัวและคุณลักษณะ</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อบิดา</label>
                  <input type="text" name="fatherName" value={formData.fatherName} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">นามสกุลบิดา</label>
                  <input type="text" name="fatherLastName" value={formData.fatherLastName} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อมารดา</label>
                  <input type="text" name="motherName" value={formData.motherName} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">นามสกุลมารดา</label>
                  <input type="text" name="motherLastName" value={formData.motherLastName} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">ตำหนิสำคัญ</label>
                  <input type="text" name="mark" value={formData.mark} onChange={handleChange} placeholder="เช่น ไฝแก้มขวา / ปกติ" className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">การศึกษา / ความรู้</label>
                  <select name="education" value={formData.education} onChange={handleChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                    <option value="มัธยมศึกษาปีที่ ๖">มัธยมศึกษาปีที่ ๖</option>
                    <option value="มัธยมศึกษาปีที่ ๓">มัธยมศึกษาปีที่ ๓</option>
                    <option value="ปวช.">ปวช.</option>
                    <option value="ปวส.">ปวส.</option>
                    <option value="ปริญญาตรี">ปริญญาตรี</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end space-x-3">
            <button type="button" onClick={onCancel} className="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm">
              ยกเลิก
            </button>
            <button type="submit" className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm shadow">
              💾 บันทึกและพิมพ์ สด.๙
            </button>
          </div>
        </form>
      );
    }

    // Recruit List Component with Debounce (300ms)
    function RecruitList({ recruits, amphurs, onPrintSD9, onSelectRecruit, onRegisterNew }) {
      const [inputSearch, setInputSearch] = useState('');
      const [debouncedSearch, setDebouncedSearch] = useState('');
      const [district, setDistrict] = useState('');

      useEffect(() => {
        const handler = setTimeout(() => {
          setDebouncedSearch(inputSearch);
        }, 300);
        return () => clearTimeout(handler);
      }, [inputSearch]);

      const filtered = recruits.filter(r => {
        if (district && r.district !== district) return false;
        if (debouncedSearch) {
          const s = debouncedSearch.toLowerCase();
          const name = `${r.firstName} ${r.lastName}`.toLowerCase();
          const cid = (r.citizenId || '').toString();
          if (!name.includes(s) && !cid.includes(s)) return false;
        }
        return true;
      });

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div className="flex gap-2 w-full sm:w-auto flex-1">
              <input
                type="text"
                value={inputSearch}
                onChange={e => setInputSearch(e.target.value)}
                placeholder="🔍 ค้นหาด้วยชื่อ, นามสกุล หรือเลข ปชช. 13 หลัก (Debounced 300ms)..."
                className="w-full sm:max-w-md px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-400"
              />
              <select
                value={district}
                onChange={e => setDistrict(e.target.value)}
                className="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white"
              >
                <option value="">ทุกอำเภอ</option>
                {amphurs.map(a => <option key={a.amphur_code} value={a.amphur_th}>อ.{a.amphur_th}</option>)}
              </select>
            </div>
            <button
              onClick={onRegisterNew}
              className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold shadow flex items-center space-x-1 whitespace-nowrap"
            >
              <span>➕</span><span>ลงบัญชีใหม่</span>
            </button>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <table className="min-w-full divide-y divide-slate-200 text-sm">
              <thead className="bg-slate-50 text-slate-700 text-xs uppercase font-semibold">
                <tr>
                  <th className="px-4 py-3 text-left">เลข ปชช. 13 หลัก</th>
                  <th className="px-4 py-3 text-left">ชื่อ - นามสกุล</th>
                  <th className="px-4 py-3 text-left">วันเดือนปีเกิด</th>
                  <th className="px-4 py-3 text-left">ภูมิลำเนาทหาร</th>
                  <th className="px-4 py-3 text-left">ใบสำคัญ สด.๙</th>
                  <th className="px-4 py-3 text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filtered.map(r => (
                  <tr key={r.id || r.citizenId} className="hover:bg-slate-50">
                    <td className="px-4 py-3 font-mono text-xs text-slate-800">{formatThaiID(r.citizenId)}</td>
                    <td className="px-4 py-3 font-bold text-slate-900">{r.firstName} {r.lastName}</td>
                    <td className="px-4 py-3 text-xs">{r.birthDate} {r.birthMonth} {r.birthYear}</td>
                    <td className="px-4 py-3 text-xs">อ.{r.district} ต.{r.subDistrict || '-'}</td>
                    <td className="px-4 py-3 text-xs"><span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-medium">เล่ม {r.sd9BookNumber || '1'} เลข {r.sd9DocNumber}</span></td>
                    <td className="px-4 py-3 text-center space-x-1">
                      <button onClick={() => onSelectRecruit(r)} className="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded font-medium">👁️ ดู</button>
                      <button onClick={() => onPrintSD9(r)} className="px-2.5 py-1 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium">🖨️ พิมพ์ สด.๙</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Official Print Modal (แบบ สด.๙)
    function PrintModal({ recruit, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-slate-100 rounded-2xl max-w-4xl w-full p-6 shadow-2xl my-8">
            <div className="print-hidden flex justify-between items-center pb-4 mb-4 border-b border-slate-300">
              <h3 className="font-bold text-slate-800">ตัวอย่างแบบพิมพ์ใบสำคัญ (แบบ สด.๙)</h3>
              <div className="flex space-x-2">
                <button onClick={() => window.print()} className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-sm font-bold shadow">
                  🖨️ สั่งพิมพ์ (A4)
                </button>
                <button onClick={onClose} className="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm">
                  ปิด
                </button>
              </div>
            </div>

            <div className="print-area bg-white p-10 mx-auto rounded shadow border-2 border-slate-900 text-slate-900 max-w-[210mm] leading-relaxed">
              <div className="flex justify-between text-xs mb-2">
                <span>สมุด สด.๑ เล่มที่ <strong>{recruit.sd9BookNumber || '๑'}</strong> เลขที่ <strong>{recruit.sd1Number || '๑'}</strong></span>
                <span className="font-bold text-sm">แบบ สด.๙</span>
              </div>
              <div className="text-center my-3 text-4xl">🦅</div>
              <div className="text-center mb-6">
                <h2 className="text-2xl font-bold">ใบสำคัญ</h2>
                <p className="text-sm font-medium">(หนังสือสำคัญแสดงการลงบัญชีทหารกองเกิน)</p>
              </div>
              <div className="text-sm space-y-4 text-justify">
                <p className="indent-8 leading-loose">
                  ใบสำคัญนี้ออกให้แก่ <strong>{recruit.firstName} {recruit.lastName}</strong> เลขประจำตัวประชาชน <strong>{formatThaiID(recruit.citizenId)}</strong> เกิดวันที่ <strong>{recruit.birthDate}</strong> เดือน <strong>{recruit.birthMonth}</strong> พ.ศ. <strong>{recruit.birthYear}</strong> สัญชาติ <strong>ไทย</strong> ศาสนา <strong>{recruit.religion || 'พุทธ'}</strong> อาชีพ <strong>{recruit.occupation || 'รับจ้าง'}</strong>
                </p>
                <p className="indent-8 leading-loose">
                  บิดาชื่อ <strong>{recruit.fatherName || '-'} {recruit.fatherLastName || ''}</strong> สัญชาติ <strong>ไทย</strong> มารดาชื่อ <strong>{recruit.motherName || '-'} {recruit.motherLastName || ''}</strong> สัญชาติ <strong>ไทย</strong> ภูมิลำเนาทหารอยู่บ้านเลขที่ <strong>{recruit.houseNumber || '-'}</strong> หมู่ที่ <strong>{recruit.moo || '๑'}</strong> ตำบล <strong>{recruit.subDistrict || '-'}</strong> อำเภอ <strong>{recruit.district || 'เมืองน่าน'}</strong> จังหวัด <strong>{recruit.province || 'น่าน'}</strong>
                </p>
                <p className="indent-8 leading-loose">
                  ตำหนิสำคัญ <strong>{recruit.mark || 'ปกติ'}</strong> ได้แสดงตนลงบัญชีทหารกองเกินไว้ที่อำเภอ <strong>{recruit.district || 'เมืองน่าน'}</strong> จังหวัด <strong>{recruit.province || 'น่าน'}</strong> เมื่อวันที่ <strong>{recruit.regDate || '๑'}</strong> เดือน <strong>{recruit.regMonth || 'มกราคม'}</strong> พ.ศ. <strong>{recruit.regYear || '๒๕๖๙'}</strong> แล้ว
                </p>
              </div>
              <div className="mt-12 flex justify-end">
                <div className="w-64 text-center text-xs space-y-2">
                  <div>ออกให้ ณ วันที่ <strong>{recruit.regDate || '๑'}</strong> เดือน <strong>{recruit.regMonth || 'มกราคม'}</strong> พ.ศ. <strong>{recruit.regYear || '๒๕๖๙'}</strong></div>
                  <div className="h-10"></div>
                  <div className="border-b border-dotted border-slate-700 w-44 mx-auto"></div>
                  <div className="font-bold">สัสดีอำเภอ{recruit.district || 'เมืองน่าน'}</div>
                </div>
              </div>
              <div className="mt-8 pt-4 border-t-2 border-slate-900 text-[11px] bg-slate-50 p-3 rounded">
                <strong>คำเตือน:</strong> เมื่อมีอายุครบ ๒๐ ปีบริบูรณ์ ต้องไปรับหมายเรียก (สด.๓๕) ณ ที่ว่าการอำเภอภูมิลำเนาทหาร เพื่อเข้ารับการตรวจเลือก (สด.๔๓) เมื่ออายุ ๒๑ ปี
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Detail Modal
    function DetailModal({ recruit, onClose, onPrintSD9 }) {
      return (
        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
            <div className="flex justify-between items-center pb-3 border-b">
              <h3 className="font-bold text-lg text-slate-900">{recruit.firstName} {recruit.lastName}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <div className="py-4 space-y-2 text-xs">
              <div className="flex justify-between py-1 border-b"><span>เลขบัตร ปชช.:</span><span className="font-mono font-bold">{formatThaiID(recruit.citizenId)}</span></div>
              <div className="flex justify-between py-1 border-b"><span>วันเกิด:</span><span>{recruit.birthDate} {recruit.birthMonth} {recruit.birthYear}</span></div>
              <div className="flex justify-between py-1 border-b"><span>ภูมิลำเนา:</span><span>อ.{recruit.district} ต.{recruit.subDistrict} ม.{recruit.moo}</span></div>
              <div className="flex justify-between py-1 border-b"><span>บิดา / มารดา:</span><span>{recruit.fatherName} / {recruit.motherName}</span></div>
              <div className="flex justify-between py-1 border-b"><span>ใบสำคัญ สด.๙:</span><span>เล่ม {recruit.sd9BookNumber} เลขที่ {recruit.sd9DocNumber}</span></div>
            </div>
            <div className="pt-3 flex justify-between">
              <button onClick={onClose} className="px-4 py-2 border rounded-lg text-xs">ปิด</button>
              <button onClick={() => onPrintSD9(recruit)} className="px-4 py-2 bg-emerald-700 text-white rounded-lg text-xs font-bold">🖨️ พิมพ์ สด.๙</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
