version: '3.8'

services:
  # MySQL 8.4 LTS Database Engine
  sassadee-db:
    image: mysql:8.4
    container_name: sassadee-db
    restart: unless-stopped
    command: >
      --mysql-native-password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --innodb-buffer-pool-size=1G
      --slow-query-log=1
      --long-query-time=1.0
      --event-scheduler=ON
    environment:
      MYSQL_ROOT_PASSWORD: sassadee_root_pass
      MYSQL_DATABASE: sassadee_db
      MYSQL_USER: sassadee_user
      MYSQL_PASSWORD: sassadee_secure_pass
    volumes:
      - sassadee_mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./server/database/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    networks:
      - sassadee-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psassadee_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Backend API Service (Node.js)
  sassadee-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: sassadee-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MYSQL_HOST=sassadee-db
      - MYSQL_PORT=3306
      - MYSQL_USER=sassadee_user
      - MYSQL_PASSWORD=sassadee_secure_pass
      - MYSQL_DATABASE=sassadee_db
      - MYSQL_POOL_LIMIT=15
    volumes:
      - ./server/data:/app/data
    depends_on:
      sassadee-db:
        condition: service_healthy
    networks:
      - sassadee-net

  # Frontend Web Client (React + Nginx)
  sassadee-web:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: sassadee-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8085}:80"
    depends_on:
      - sassadee-api
    networks:
      - sassadee-net

volumes:
  sassadee_mysql_data:
    driver: local

networks:
  sassadee-net:
    driver: bridge
